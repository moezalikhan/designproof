name: DesignProof

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  designproof:
    name: DesignProof — policy verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Alloy 6.2.0 jar
        run: |
          curl -fsSL \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar \
            -o org.alloytools.alloy.dist.jar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest demo_app/tests/ -v

      - name: Run DesignProof checker
        run: |
          python designproof.py models/permissions.als
        # Exit 1 if any rule is violated; the step (and build) will fail.

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designproof-results
          path: |
            results.json
            permissions/
